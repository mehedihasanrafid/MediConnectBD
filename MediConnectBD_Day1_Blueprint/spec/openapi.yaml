      type: object
      required:
      - id
      - displayName
      - approvalStatus
      - videoFeeMinor
      - chamberFeeMinor
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
          type: string
        approvalStatus:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - SUSPENDED
        specialties:
          type: array
          items:
            type: string
        area:
          type: string
