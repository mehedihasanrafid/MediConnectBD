name: mediconnect-bd

x-app-environment: &app-environment
  NODE_ENV: production
  PORT: 4000
  APP_URL: ${APP_URL:-http://localhost:5173}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-mediconnect}
  DB_USER: ${DB_USER:-mediconnect_app}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  REDIS_URL: redis://redis:6379
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}
  ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mediconnect}
      MYSQL_USER: ${DB_USER:-mediconnect_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    ports:
      - "${DB_EXPOSE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    environment: *app-environment
    command: ["npm", "run", "migration:run", "-w", "@mediconnect/api"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    restart: unless-stopped
    environment: *app-environment
    command: ["node", "apps/api/dist/server.js"]
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    restart: unless-stopped
    environment: *app-environment
    command: ["node", "apps/worker/dist/worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    environment:
      <<: *app-environment
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    command: ["npm", "run", "seed", "-w", "@mediconnect/api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  mysql_data:
  redis_data:
